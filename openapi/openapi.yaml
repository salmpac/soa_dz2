openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: |
    Контрактный API маркетплейса: товары, заказы, промокоды, JWT-авторизация.

    ## Роли
    Роль хранится в JWT (claim `role`) и бывает `USER`, `SELLER`, `ADMIN`.
    Допустимые роли каждого эндпоинта перечислены в его описании и в расширении `x-roles`.
    При недостаточных правах возвращается `403 ACCESS_DENIED`.

    ## Ошибки
    Все ошибки имеют единый формат `Error` (`error_code`, `message`, `details`).
servers:
  - url: http://localhost:8000

tags:
  - name: auth
    description: Регистрация и выдача JWT-токенов
  - name: products
    description: Каталог товаров
  - name: orders
    description: Заказы
  - name: promo-codes
    description: Промокоды

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- auth
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация пользователя
      description: Доступно без токена. Роль выбирается при регистрации (учебное упрощение).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Пользователь с таким email уже существует (`USER_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Аутентификация, возвращает access + refresh токены
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Неверный email или пароль (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Обновление access token по refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Refresh token невалиден или просрочен (`REFRESH_TOKEN_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------- products
  /products:
    post:
      tags: [products]
      operationId: createProduct
      summary: Создание товара
      description: |
        Роли: `SELLER` (товар привязывается к продавцу), `ADMIN`. `USER` — запрещено.
      x-roles: [SELLER, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Товар создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [products]
      operationId: listProducts
      summary: Список товаров с пагинацией и фильтрацией
      description: 'Роли: `USER`, `SELLER`, `ADMIN` — все товары.'
      x-roles: [USER, SELLER, ADMIN]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Номер страницы, начиная с 0
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Размер страницы
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Фильтр по статусу
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: category
          in: query
          description: Фильтр по категории (точное совпадение)
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Страница товаров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [products]
      operationId: getProduct
      summary: Получение товара по ID
      description: 'Роли: `USER`, `SELLER`, `ADMIN` — любой товар.'
      x-roles: [USER, SELLER, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    put:
      tags: [products]
      operationId: updateProduct
      summary: Обновление товара
      description: 'Роли: `SELLER` — только свои товары, `ADMIN` — любые.'
      x-roles: [SELLER, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Обновлённый товар
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Мягкое удаление (перевод в статус ARCHIVED)
      description: |
        Запись не удаляется физически, статус становится `ARCHIVED`.
        Роли: `SELLER` — только свои товары, `ADMIN` — любые.
      x-roles: [SELLER, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Товар переведён в ARCHIVED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'

  # ---------------------------------------------------------------- orders
  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создание заказа
      description: |
        Роли: `USER`, `ADMIN`. `SELLER` — запрещено.

        Проверки выполняются последовательно: лимит частоты (`ORDER_LIMIT_EXCEEDED`),
        активный заказ (`ORDER_HAS_ACTIVE`), каталог (`PRODUCT_NOT_FOUND` / `PRODUCT_INACTIVE`),
        остатки (`INSUFFICIENT_STOCK`), промокод (`PROMO_CODE_INVALID` / `PROMO_CODE_MIN_AMOUNT`).
        Резервирование остатков, снапшот цен и создание заказа — в одной транзакции.
      x-roles: [USER, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: '`PRODUCT_INACTIVE`, `ORDER_HAS_ACTIVE` или `INSUFFICIENT_STOCK`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                insufficientStock:
                  value:
                    error_code: INSUFFICIENT_STOCK
                    message: Insufficient stock for some products
                    details:
                      products:
                        - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                          requested: 5
                          available: 2
        '422':
          $ref: '#/components/responses/PromoCodeError'
        '429':
          $ref: '#/components/responses/OrderLimitExceeded'

  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Получение заказа по ID
      description: 'Роли: `USER` — только свои заказы, `ADMIN` — любые. `SELLER` — запрещено.'
      x-roles: [USER, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OrderForbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
    put:
      tags: [orders]
      operationId: updateOrder
      summary: Обновление позиций заказа
      description: |
        Роли: `USER` — только свои заказы, `ADMIN` — любые. `SELLER` — запрещено.

        Разрешено только в статусе `CREATED`. Старые остатки возвращаются, новые резервируются,
        стоимость и скидка пересчитываются — всё в одной транзакции.
      x-roles: [USER, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Обновлённый заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OrderForbidden'
        '404':
          description: '`ORDER_NOT_FOUND` или `PRODUCT_NOT_FOUND`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`INVALID_STATE_TRANSITION`, `PRODUCT_INACTIVE` или `INSUFFICIENT_STOCK`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/PromoCodeError'
        '429':
          $ref: '#/components/responses/OrderLimitExceeded'

  /orders/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Отмена заказа
      description: |
        Роли: `USER` — только свои заказы, `ADMIN` — любые. `SELLER` — запрещено.

        Разрешено из `CREATED` и `PAYMENT_PENDING`. Остатки и использование промокода возвращаются.
      x-roles: [USER, ADMIN]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OrderForbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/InvalidStateTransition'

  /orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [orders]
      operationId: changeOrderStatus
      summary: Перевод заказа в следующее состояние
      description: |
        Роли: `USER` — только свои заказы, `ADMIN` — любые. `SELLER` — запрещено.

        Допустимые переходы: `CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED`.
        Отмена выполняется отдельным эндпоинтом `/orders/{id}/cancel`.
        Любой другой переход — `INVALID_STATE_TRANSITION`.
      x-roles: [USER, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChange'
      responses:
        '200':
          description: Заказ в новом состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OrderForbidden'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '409':
          $ref: '#/components/responses/InvalidStateTransition'

  # ---------------------------------------------------------------- promo codes
  /promo-codes:
    post:
      tags: [promo-codes]
      operationId: createPromoCode
      summary: Создание промокода
      description: 'Роли: `SELLER`, `ADMIN`. `USER` — запрещено.'
      x-roles: [SELLER, ADMIN]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
      responses:
        '201':
          description: Промокод создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Промокод с таким кодом уже существует (`PROMO_CODE_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (15 минут). Claims: `sub` (user id), `role`, `type: access`.
        Просроченный токен — `401 TOKEN_EXPIRED`, невалидный — `401 TOKEN_INVALID`.

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Идентификатор товара
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      description: Идентификатор заказа
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Ошибка валидации входных данных (`VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error_code: VALIDATION_ERROR
            message: Request validation failed
            details:
              errors:
                - field: body.price
                  message: Input should be greater than or equal to 0.01
                  constraint: greater_than_equal
    Unauthorized:
      description: Токен отсутствует, просрочен или невалиден (`TOKEN_EXPIRED`, `TOKEN_INVALID`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав (`ACCESS_DENIED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderForbidden:
      description: Недостаточно прав (`ACCESS_DENIED`) или заказ принадлежит другому пользователю (`ORDER_OWNERSHIP_VIOLATION`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProductNotFound:
      description: Товар не найден (`PRODUCT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderNotFound:
      description: Заказ не найден (`ORDER_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidStateTransition:
      description: Недопустимый переход состояния заказа (`INVALID_STATE_TRANSITION`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PromoCodeError:
      description: Промокод не применим (`PROMO_CODE_INVALID`, `PROMO_CODE_MIN_AMOUNT`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderLimitExceeded:
      description: Превышен лимит частоты создания/обновления заказа (`ORDER_LIMIT_EXCEEDED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ------------------------------------------------------------ common
    Error:
      type: object
      description: Единый формат ошибки
      required: [error_code, message]
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Человекочитаемое описание
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Дополнительные данные (например, список полей с ошибками валидации)

    ErrorCode:
      type: string
      description: Машиночитаемый код ошибки
      enum:
        - VALIDATION_ERROR
        - PRODUCT_NOT_FOUND
        - PRODUCT_INACTIVE
        - ORDER_NOT_FOUND
        - ORDER_LIMIT_EXCEEDED
        - ORDER_HAS_ACTIVE
        - INVALID_STATE_TRANSITION
        - INSUFFICIENT_STOCK
        - PROMO_CODE_INVALID
        - PROMO_CODE_MIN_AMOUNT
        - ORDER_OWNERSHIP_VIOLATION
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - REFRESH_TOKEN_INVALID
        - INVALID_CREDENTIALS
        - USER_ALREADY_EXISTS
        - PROMO_CODE_ALREADY_EXISTS
        - ACCESS_DENIED
        - INTERNAL_ERROR

    Role:
      type: string
      enum: [USER, SELLER, ADMIN]

    # ------------------------------------------------------------ auth
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 6
          maxLength: 128
        role:
          $ref: '#/components/schemas/Role'
      example:
        email: user@example.com
        password: secret123
        role: USER

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 128

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Срок жизни access token в секундах

    UserResponse:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time

    # ------------------------------------------------------------ products
    ProductStatus:
      type: string
      description: Состояние товара
      enum: [ACTIVE, INACTIVE, ARCHIVED]

    ProductEditableStatus:
      type: string
      description: Статусы, которые можно задать через API (ARCHIVED только через DELETE)
      enum: [ACTIVE, INACTIVE]

    ProductCreate:
      type: object
      required: [name, price, stock, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
          description: Цена товара (> 0), два знака после запятой
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          allOf:
            - $ref: '#/components/schemas/ProductEditableStatus'
          description: Начальный статус. Если не передан — ACTIVE. ARCHIVED задаётся только через DELETE.
      example:
        name: Клавиатура
        description: Механическая, 87 клавиш
        price: 4999.90
        stock: 10
        category: electronics

    ProductUpdate:
      type: object
      required: [name, price, stock, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          type: number
          format: decimal
          minimum: 0.01
        stock:
          type: integer
          format: int32
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          allOf:
            - $ref: '#/components/schemas/ProductEditableStatus'
          description: Если не передан — статус не меняется. ARCHIVED через PUT задать нельзя, используйте DELETE.

    ProductResponse:
      type: object
      required: [id, name, description, price, stock, category, status, seller_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          format: decimal
        stock:
          type: integer
          format: int32
        category:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        seller_id:
          type: string
          format: uuid
          description: Владелец-продавец
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    ProductPage:
      type: object
      required: [items, totalElements, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов
        page:
          type: integer
          description: Номер текущей страницы (с 0)
        size:
          type: integer
          description: Размер страницы

    # ------------------------------------------------------------ orders
    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]

    OrderItemCreate:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999

    OrderCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemCreate'
        promo_code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
          nullable: true
      example:
        items:
          - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
            quantity: 2
        promo_code: SALE10

    OrderUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemCreate'

    OrderStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Целевое состояние (следующее по цепочке)
          enum: [PAYMENT_PENDING, PAID, SHIPPED, COMPLETED]

    OrderItemResponse:
      type: object
      required: [id, product_id, quantity, price_at_order]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        price_at_order:
          type: number
          format: decimal
          description: Цена за единицу на момент заказа (snapshot)

    OrderResponse:
      type: object
      required: [id, user_id, status, promo_code_id, total_amount, discount_amount, items, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        promo_code_id:
          type: string
          format: uuid
          nullable: true
        total_amount:
          type: number
          format: decimal
          description: Итоговая сумма с учётом скидки
        discount_amount:
          type: number
          format: decimal
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ------------------------------------------------------------ promo codes
    DiscountType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]

    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value, min_order_amount, max_uses, valid_from, valid_until]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
        discount_type:
          $ref: '#/components/schemas/DiscountType'
        discount_value:
          type: number
          format: decimal
          minimum: 0.01
          description: Процент (для PERCENTAGE, не более 100) или фиксированная сумма
        min_order_amount:
          type: number
          format: decimal
          minimum: 0
          default: 0
        max_uses:
          type: integer
          format: int32
          minimum: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
          default: true
      example:
        code: SALE10
        discount_type: PERCENTAGE
        discount_value: 10
        min_order_amount: 1000
        max_uses: 100
        valid_from: '2026-01-01T00:00:00Z'
        valid_until: '2027-01-01T00:00:00Z'

    PromoCodeResponse:
      type: object
      required: [id, code, discount_type, discount_value, min_order_amount, max_uses, current_uses, valid_from, valid_until, active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        discount_type:
          $ref: '#/components/schemas/DiscountType'
        discount_value:
          type: number
          format: decimal
        min_order_amount:
          type: number
          format: decimal
        max_uses:
          type: integer
          format: int32
        current_uses:
          type: integer
          format: int32
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
